format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  test_default_all_mirrors:
    steps:
    - path::./:
        title: Execute step (defaults)
        run_if: "true"
        is_skippable: false
        inputs:
        - verbose: "true"
    - script:
        title: Verify step is a no-op (gradle mirrors temporarily disabled)
        inputs:
        - content: |-
            #!/bin/bash
            set -ex

            init_file=~/.gradle/init.d/bitrise-gradle-mirrors.init.gradle.kts

            if [ -f "$init_file" ]; then
              echo "Expected $init_file NOT to be written while mirrors are disabled"
              exit 1
            fi
